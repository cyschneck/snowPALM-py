name: snowpalm
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.15  # minimum support 3.12, maximum support 3.14
  - earthaccess         # NASA: EarthAccess for data
  - xarray              # working with netCDF data
  - dask                # optimizes chunks and parallel processing
  - netcdf4             # reading/writing NetCDF files
  - h5netcdf            # reading/writing NetCDF files
  - bottleneck          # improves NaN-skipping array operations
  - scipy               # interpolation and advanced math
  - matplotlib          # plotting
  - cartopy             # plotting
